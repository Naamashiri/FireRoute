# Listen on every network interface so another device on the same local network
# can reach the application through this computer's LAN address.
server.address=0.0.0.0
server.port=8080

# ---------------------------------------------------------------------------
# Data files, resolved from the classpath root (src/main/resources)
# ---------------------------------------------------------------------------
fireroute.data.map=map.json
fireroute.data.shelters=shelters.json

# A GPS point farther than this from the loaded walking graph is outside the
# supported area and must not silently snap to an unrelated Tel Aviv junction.
fireroute.routing.max-snap-distance-meters=250

# The Home Front Command alert area this service covers.
# Official name in the Home Front Command area list: \u05EA\u05DC \u05D0\u05D1\u05D9\u05D1 - \u05DE\u05E8\u05DB\u05D6 \u05D4\u05E2\u05D9\u05E8
# ("Tel Aviv - city centre"). Kept as a slug here so the file stays ASCII.
fireroute.area.id=tel-aviv-center

# ---------------------------------------------------------------------------
# Alerts
# ---------------------------------------------------------------------------
# Where alerts come from: "simulated" or "oref".
# Simulated is the default deliberately — the real feed is undocumented and
# reachable only from inside Israel, which is a poor thing to depend on at
# startup. Choosing "oref" also removes POST /api/alerts/simulate.
fireroute.alerts.source=simulated

# How often the source is asked. Measured from the END of the previous call
# (fixedDelay), so a slow source spaces calls out instead of queueing them.
# One second, not five: this is the delay between raising an alert and the
# client seeing it, and five seconds of nothing happening reads as a bug.
fireroute.alerts.poll-millis=1000

# After this many seconds without a successful ACTIVE/QUIET read, clients must
# treat the last known state as old information rather than current truth.
fireroute.alerts.stale-after-seconds=10

# Oref area names that affect this service, separated by "|". This supports
# aliases without confusing commas that may legitimately appear in area names.
fireroute.alerts.supported-areas=\u05EA\u05DC \u05D0\u05D1\u05D9\u05D1 - \u05DE\u05E8\u05DB\u05D6 \u05D4\u05E2\u05D9\u05E8

# Undocumented, unofficial, and known to change. Overridable for that reason.
fireroute.alerts.oref-url=https://www.oref.org.il/WarningMessages/alert/alerts.json
