<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireRoute</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#111418; --panel:#1a1f26; --line:#2b323c; --text:#e6e9ee; --muted:#8b95a5;
          --safe:#3fb27f; --alert:#e0524a; --accent:#4a9de0; --amber:#e8a13a; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; font:13.5px/1.45 system-ui,sans-serif;
         background:var(--bg); color:var(--text); }
  #panel { width:330px; flex-shrink:0; padding:16px; overflow-y:auto;
           background:var(--panel); border-right:1px solid var(--line); }
  #map { flex:1; cursor:crosshair; }
  h1 { margin:0 0 2px; font-size:17px; }
  .sub { color:var(--muted); font-size:11.5px; margin-bottom:12px; }
  label { display:block; margin:10px 0 3px; font-size:11.5px; color:var(--muted); }
  select, input, button { width:100%; padding:7px 9px; border-radius:6px;
           border:1px solid var(--line); background:#12161c; color:var(--text); font:inherit; }
  button { cursor:pointer; border-color:transparent; font-weight:600; margin-top:6px; }
  button.primary { background:var(--accent); color:#08111a; }
  button.raise   { background:var(--alert); color:#fff; }
  button.clear   { background:var(--safe); color:#04241a; }
  button.ghost   { background:#12161c; color:var(--muted); font-weight:500; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  #banner { margin:10px 0 6px; padding:9px 11px; border-radius:6px; text-align:center;
            font-weight:700; letter-spacing:.04em; font-size:13px; }
  #banner.quiet { background:rgba(63,178,127,.12); color:var(--safe); }
  #banner.live  { background:var(--alert); color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.5; } }
  #hint { margin-top:10px; background:rgba(74,157,224,.1); border:1px solid rgba(74,157,224,.28);
          color:var(--accent); padding:7px 10px; border-radius:6px; font-size:12px; }
  #picks { margin-top:8px; font-size:11.5px; }
  .row { display:flex; justify-content:space-between; padding:2px 0; gap:10px; }
  .row span:first-child { color:var(--muted); }
  #stats { margin-top:10px; border-top:1px solid var(--line); padding-top:9px; font-size:12.5px; }
  #tuning { margin-top:14px; border-top:1px solid var(--line); padding-top:6px; }
  .warn { color:var(--alert); } .ok { color:var(--safe); } .amber { color:var(--amber); }
  .note { margin-top:8px; padding:7px 9px; border-radius:6px; font-size:12px;
          background:rgba(224,82,74,.13); color:#ffb1ab; }
  .big { font-size:22px; font-weight:700; line-height:1.1; }
  .split { display:flex; gap:8px; margin-top:8px; }
  .card { flex:1; padding:8px 9px; border-radius:6px; background:#12161c; text-align:center; }
  .card .lbl { font-size:10.5px; color:var(--muted); text-transform:uppercase;
               letter-spacing:.05em; margin-top:2px; }
  .bar { height:13px; border-radius:3px; }
  .barrow { display:flex; align-items:center; gap:6px; padding:2px 0; font-size:11.5px; }
  .barrow .n { width:44px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .walker, .fire, .pin, .refuge { font-size:20px; line-height:20px; text-align:center;
                                  text-shadow:0 0 5px rgba(0,0,0,.9); }
  .tiny { font-size:15px; line-height:15px; }
  .fire { animation:flicker .5s infinite alternate; }
  .refuge { font-size:30px; }
  @keyframes flicker { to { opacity:.4; transform:scale(.8); } }
  .door { font: 700 11px/18px system-ui,sans-serif; text-align:center; border-radius:9px;
          padding:0 6px; white-space:nowrap; border:2px solid #0b0e12; }
  .door.ok   { background:var(--safe); color:#04241a; }
  .door.full { background:var(--alert); color:#fff; }
  .stranded { animation:shake .6s infinite; }
  @keyframes shake { 25% { transform:translateX(-1.5px);} 75% { transform:translateX(1.5px);} }
</style>
</head>
<body>

<div id="panel">
  <h1>FireRoute</h1>
  <div class="sub">Shelter-aware walking routes &mdash; Tel Aviv city centre</div>

  <div id="banner" class="quiet">NO ALERT</div>
  <button id="alertToggle" class="raise">Simulate alert</button>

  <div id="hint">Click the map to set your <b>start</b>, or send a crowd out walking.</div>

  <div id="picks">
    <div class="row"><span>Start</span><span id="pickFrom">&mdash;</span></div>
    <div class="row"><span>Destination</span><span id="pickTo">&mdash;</span></div>
  </div>

  <button id="go" class="primary" disabled>Start walking</button>
  <button id="random" class="ghost">Random walker</button>
  <button id="crowd" class="ghost">Send out a crowd (40)</button>
  <button id="reset" class="ghost">Clear everyone</button>

  <div id="stats"></div>

  <div id="tuning">
    <label for="pace">Walking pace</label>
    <select id="pace">
      <option>SLOW</option><option selected>AVERAGE</option><option>FAST</option>
    </select>

    <label for="fear">Fear factor &mdash; extra walking minutes paid per minute of exposure: <b id="fearVal">1</b></label>
    <input id="fear" type="range" min="0" max="10" step="0.5" value="1">

    <label for="maxShelter">Max minutes from a shelter</label>
    <input id="maxShelter" type="number" value="7" step="0.5" min="0">

    <label for="capacity">Places per shelter (assumed) <b id="capVal">6</b></label>
    <input id="capacity" type="range" min="2" max="20" step="1" value="6">
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WALK_SECONDS = 18;    // one route, whatever its real length
const TICK_MS = 50;
const CROWD_SIZE = 40;
const MAX_PARALLEL = 6;     // browsers cap concurrent connections per origin anyway

// The extent of map.json, so a random start always snaps to a junction that exists.
const GRAPH_BOUNDS = { south: 32.0530, north: 32.0830, west: 34.7560, east: 34.7920 };

const map = L.map('map').setView([32.0680, 34.7740], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);

const pinLayer       = L.layerGroup().addTo(map);
const abandonedLayer = L.layerGroup().addTo(map);
const routeLayer     = L.layerGroup().addTo(map);
const crowdLayer     = L.layerGroup().addTo(map);
const doorLayer      = L.layerGroup().addTo(map);
const $ = id => document.getElementById(id);

let from = null, to = null;
let alertActive = false;
let timer = null;

/** Everyone on the map. The hand-picked walker is simply a crowd of one. */
let walkers = [];

/** shelterId -> { latlng, admitted, turnedAway } — filled as people arrive. */
let doors = {};

$('fear').oninput = () => { $('fearVal').textContent = $('fear').value; };
$('capacity').oninput = () => { $('capVal').textContent = $('capacity').value; };

function capacity() { return parseInt($('capacity').value, 10); }

function icon(cls, glyph, size) {
  const s = size || 24;
  return L.divIcon({ className: '', iconSize: [s, s], iconAnchor: [s/2, s/2],
                     html: '<div class="' + cls + '">' + glyph + '</div>' });
}

async function callApi(url) {
  const r = await fetch(url);
  const body = await r.text();
  if (!r.ok) { throw new Error('HTTP ' + r.status + ' - ' + body.slice(0, 200)); }
  return JSON.parse(body);
}

function fail(m) { $('stats').innerHTML = '<div class="warn">' + m + '</div>'; }

function baseParams() {
  const p = new URLSearchParams();
  p.set('walkingPace', $('pace').value);
  p.set('fearFactor', $('fear').value);
  p.set('maxShelterMinutes', $('maxShelter').value);
  return p;
}

/** A few at a time rather than firing every request at once. */
async function inBatches(items, worker) {
  const out = [];
  for (let i = 0; i < items.length; i += MAX_PARALLEL) {
    out.push(...await Promise.all(items.slice(i, i + MAX_PARALLEL).map(worker)));
  }
  return out;
}

function randomPoint() {
  return { lat: GRAPH_BOUNDS.south + Math.random() * (GRAPH_BOUNDS.north - GRAPH_BOUNDS.south),
           lon: GRAPH_BOUNDS.west  + Math.random() * (GRAPH_BOUNDS.east  - GRAPH_BOUNDS.west) };
}

// ---------------------------------------------------------------------------
// Walkers
// ---------------------------------------------------------------------------

function makeWalker(result, options) {
  const points = result.pathPoints.map(p => [p.latitude, p.longitude]);
  const ids    = result.pathPoints.map(p => p.id);

  const w = { points: points, ids: ids, leg: 0, legProgress: 0,
              destinationId: options.destinationId || null,
              solo: !!options.solo, state: 'walking', marker: null };

  const layer = w.solo ? routeLayer : crowdLayer;

  if (w.solo && points.length > 1) {
    L.polyline(points, { color: options.colour, weight: alertActive ? 7 : 5, opacity: .95 })
      .addTo(layer);
    L.circleMarker(points[points.length - 1],
      { radius: 8, color: '#fff', weight: 2, fillColor: options.colour, fillOpacity: 1 })
      .addTo(layer).bindTooltip(alertActive ? 'Nearest shelter' : 'Destination');
  }

  // interactive:false matters for the crowd: an interactive marker swallows the
  // click, and forty of them scattered about would eat the taps meant for the map.
  w.marker = L.marker(points[0], {
    icon: icon(w.solo ? 'walker' : 'walker tiny', '&#128694;'),
    interactive: w.solo, zIndexOffset: w.solo ? 1000 : 0
  }).addTo(layer);

  return w;
}

function walkerLatLng(w) {
  const a = w.points[w.leg];
  const b = w.points[Math.min(w.leg + 1, w.points.length - 1)];
  return [a[0] + (b[0] - a[0]) * w.legProgress, a[1] + (b[1] - a[1]) * w.legProgress];
}

/** The last junction passed — what a real client would report as its position. */
function currentJunctionId(w) { return w.ids[w.leg]; }

// ---------------------------------------------------------------------------
// Arriving at a shelter
//
// The server answers each request on its own and has no idea who it has already
// sent where, so everyone in a neighbourhood is told to run to the same door.
// Shelters have a finite number of places; the ones who arrive after it is full
// are left standing in the street. That is the whole point of this simulation,
// and the number a load-aware assignment would have to bring down.
//
// The capacity is assumed — the municipal shelter export carries an area in
// square metres, not a headcount — so it is a slider, not a constant pretending
// to be data.
// ---------------------------------------------------------------------------

function arriveAtShelter(w) {
  const shelterId = w.ids[w.ids.length - 1];
  const at = w.points[w.points.length - 1];

  if (!doors[shelterId]) { doors[shelterId] = { latlng: at, admitted: 0, turnedAway: 0 }; }
  const door = doors[shelterId];

  if (door.admitted < capacity()) {
    door.admitted++;
    w.state = 'sheltered';
    w.marker.remove();                       // inside; off the street
  } else {
    door.turnedAway++;
    w.state = 'outside';
    // Ring them around the door so a pile-up reads as a pile-up.
    const angle = door.turnedAway * 2.4;
    const ring = 0.00012 * (1 + Math.floor(door.turnedAway / 8));
    w.marker.setLatLng([at[0] + Math.sin(angle) * ring, at[1] + Math.cos(angle) * ring * 1.2]);
    w.marker.setIcon(icon('walker tiny stranded', '&#129485;'));
  }

  drawDoor(shelterId);
  renderCrowdStats();
}

function drawDoor(shelterId) {
  const door = doors[shelterId];
  const full = door.admitted >= capacity();
  const label = door.admitted + '/' + capacity() +
                (door.turnedAway ? '  +' + door.turnedAway : '');

  if (door.marker) { door.marker.remove(); }
  door.marker = L.marker(door.latlng, {
    icon: L.divIcon({ className: '', iconSize: [64, 18], iconAnchor: [32, 26],
                      html: '<div class="door ' + (full ? 'full' : 'ok') + '">' + label + '</div>' }),
    interactive: false, zIndexOffset: 500
  }).addTo(doorLayer);
}

function stepWalker(w) {
  if (w.state !== 'walking') { return; }

  if (w.points.length < 2) { if (alertActive) { arriveAtShelter(w); } else { w.state = 'done'; } return; }

  w.legProgress += (w.points.length - 1) / (WALK_SECONDS * 1000 / TICK_MS);
  while (w.legProgress >= 1 && w.leg < w.points.length - 1) { w.legProgress -= 1; w.leg += 1; }

  if (w.leg >= w.points.length - 1) {
    w.leg = w.points.length - 1; w.legProgress = 0;
    w.marker.setLatLng(w.points[w.leg]);
    if (alertActive) { arriveAtShelter(w); } else { w.state = 'done'; }
    return;
  }
  w.marker.setLatLng(walkerLatLng(w));
}

function tick() {
  walkers.forEach(stepWalker);
  if (walkers.every(w => w.state !== 'walking')) { stopClock(); }
}

function startClock() { stopClock(); timer = setInterval(tick, TICK_MS); }
function stopClock()  { if (timer) { clearInterval(timer); timer = null; } }

function clearEveryone() {
  stopClock(); walkers = []; doors = {};
  routeLayer.clearLayers(); crowdLayer.clearLayers();
  abandonedLayer.clearLayers(); doorLayer.clearLayers();
  $('stats').innerHTML = '';
}

// ---------------------------------------------------------------------------
// Picking a single walker by hand
// ---------------------------------------------------------------------------

map.on('click', async e => {
  try {
    const j = await callApi('/api/junctions/nearest?lat=' + e.latlng.lat + '&lon=' + e.latlng.lng);
    if (!from || to) { setFrom(j); } else { setTo(j); }
  } catch (err) { fail(err.message); }
});

function setFrom(j) {
  clearEveryone();
  from = j; to = null;
  $('pickFrom').textContent = j.id; $('pickTo').textContent = '—';
  $('hint').innerHTML = 'Now click your <b>destination</b>.';
  $('go').disabled = true;
  redrawPins();
}

function setTo(j) {
  to = j;
  $('pickTo').textContent = j.id;
  $('hint').innerHTML = 'Ready — press <b>Start walking</b>.';
  $('go').disabled = false;
  redrawPins();
  map.fitBounds(L.latLngBounds(
    [[from.latitude, from.longitude], [to.latitude, to.longitude]]).pad(0.3), { maxZoom: 17 });
}

function redrawPins() {
  pinLayer.clearLayers();
  if (from) { L.marker([from.latitude, from.longitude], { icon: icon('pin', '&#128205;') })
                .addTo(pinLayer).bindTooltip('Start'); }
  if (to)   { L.marker([to.latitude, to.longitude], { icon: icon('pin', '&#127937;') })
                .addTo(pinLayer).bindTooltip('Destination'); }
}

async function startWalk() {
  clearEveryone();
  const p = baseParams();
  p.set('sourceId', from.id); p.set('destinationId', to.id);
  try {
    const result = await callApi('/api/routes?' + p);
    if (!result.found) { fail('no route — ' + (result.failureReason || '')); return; }
    walkers = [ makeWalker(result, { solo: true, colour: '#4a9de0', destinationId: to.id }) ];
    map.fitBounds(L.latLngBounds(walkers[0].points).pad(0.3), { maxZoom: 18 });
    showSoloStats(result);
    startClock();
  } catch (e) { console.error(e); fail(e.message); }
}

async function randomWalker() {
  try {
    const a = randomPoint(), b = randomPoint();
    const [ja, jb] = await Promise.all([
      callApi('/api/junctions/nearest?lat=' + a.lat + '&lon=' + a.lon),
      callApi('/api/junctions/nearest?lat=' + b.lat + '&lon=' + b.lon)
    ]);
    setFrom(ja); setTo(jb);
    await startWalk();
  } catch (e) { console.error(e); fail(e.message); }
}

// ---------------------------------------------------------------------------
// A crowd
// ---------------------------------------------------------------------------

/**
 * Everyone starts inside one neighbourhood rather than scattered across the
 * whole map. That is what an alert area actually is — one siren, one crowd of
 * neighbours — and it is what makes them compete for the same doors.
 */
async function spawnCrowd() {
  clearEveryone(); pinLayer.clearLayers();
  from = null; to = null;
  $('pickFrom').textContent = '—'; $('pickTo').textContent = '—';
  $('go').disabled = true;
  $('stats').innerHTML = '<div class="row"><span>Crowd</span><span>routing…</span></div>';

  const centre = randomPoint();
  const spread = 0.0045;   // roughly 500 m
  const near = () => ({
    lat: centre.lat + (Math.random() - 0.5) * spread,
    lon: centre.lon + (Math.random() - 0.5) * spread * 1.2
  });

  const pairs = Array.from({ length: CROWD_SIZE }, () => [near(), randomPoint()]);

  try {
    const snapped = await inBatches(pairs, async pair => {
      const [a, b] = await Promise.all([
        callApi('/api/junctions/nearest?lat=' + pair[0].lat + '&lon=' + pair[0].lon),
        callApi('/api/junctions/nearest?lat=' + pair[1].lat + '&lon=' + pair[1].lon)
      ]);
      return { from: a, to: b };
    });

    const routed = await inBatches(snapped, async s => {
      const p = baseParams();
      p.set('sourceId', s.from.id); p.set('destinationId', s.to.id);
      try {
        const result = await callApi('/api/routes?' + p);
        return result.found ? { result: result, destinationId: s.to.id } : null;
      } catch (e) { return null; }
    });

    walkers = routed.filter(Boolean)
      .map(r => makeWalker(r.result, { solo: false, destinationId: r.destinationId }));

    $('hint').innerHTML = '<b>' + walkers.length + '</b> neighbours are out walking. ' +
                          'Now raise the alert.';
    $('stats').innerHTML =
      '<div class="row"><span>Out walking</span><span>' + walkers.length + '</span></div>';

    const all = walkers.flatMap(w => w.points);
    map.fitBounds(L.latLngBounds(all).pad(0.15));
    startClock();
  } catch (e) { console.error(e); fail(e.message); }
}

// ---------------------------------------------------------------------------
// The alert
// ---------------------------------------------------------------------------

async function divertEveryone() {
  stopClock();
  doors = {}; doorLayer.clearLayers();

  const solo = walkers.length === 1 && walkers[0].solo;

  if (solo) {
    const w = walkers[0];
    const abandoned = w.points.slice(w.leg);
    abandonedLayer.clearLayers();
    if (abandoned.length > 1) {
      L.polyline(abandoned, { color: '#6b7480', weight: 4, opacity: .5, dashArray: '6 8' })
        .addTo(abandonedLayer);
      const marks = Math.min(5, abandoned.length);
      for (let i = 0; i < marks; i++) {
        const at = Math.floor(i * (abandoned.length - 1) / Math.max(1, marks - 1));
        L.marker(abandoned[at], { icon: icon('fire', '&#128293;'), interactive: false })
          .addTo(abandonedLayer);
      }
    }
  }

  const previous = walkers.filter(w => w.state === 'walking' || w.state === 'done');
  routeLayer.clearLayers(); crowdLayer.clearLayers();

  const diverted = await inBatches(previous, async w => {
    const p = baseParams();
    p.set('sourceId', currentJunctionId(w));
    try {
      const result = await callApi('/api/routes/emergency?' + p);
      return result.found
        ? makeWalker(result, { solo: w.solo, colour: '#e0524a', destinationId: w.destinationId })
        : null;
    } catch (e) { return null; }
  });

  walkers = diverted.filter(Boolean);

  if (solo) { showSoloDivert(walkers[0]); } else { renderCrowdStats(); }
  startClock();
}

/** All clear: back to the original destination from wherever each ended up. */
async function resumeEveryone() {
  abandonedLayer.clearLayers(); doorLayer.clearLayers(); doors = {};
  const previous = walkers;
  routeLayer.clearLayers(); crowdLayer.clearLayers();

  const resumed = await inBatches(previous, async w => {
    if (!w.destinationId) { return null; }
    const p = baseParams();
    p.set('sourceId', currentJunctionId(w));
    p.set('destinationId', w.destinationId);
    try {
      const result = await callApi('/api/routes?' + p);
      return result.found
        ? makeWalker(result, { solo: w.solo, colour: '#4a9de0', destinationId: w.destinationId })
        : null;
    } catch (e) { return null; }
  });

  walkers = resumed.filter(Boolean);
  $('stats').innerHTML =
    '<div class="row"><span>Out walking</span><span>' + walkers.length + '</span></div>' +
    '<div class="note" style="background:rgba(63,178,127,.12);color:#9fe3c2">' +
      'All clear — everyone is continuing.</div>';
  startClock();
}

// ---------------------------------------------------------------------------
// Reporting
// ---------------------------------------------------------------------------

function showSoloStats(result, note) {
  const ok = result.shelterConstraintSatisfied;
  $('stats').innerHTML =
    '<div class="row"><span>Mode</span><span>' + (alertActive ? 'EMERGENCY' : 'normal') + '</span></div>' +
    '<div class="row"><span>Walking time</span><span>' + result.totalTravelTime.toFixed(1) + ' min</span></div>' +
    '<div class="row"><span>Worst exposure</span><span>' + result.maxMinutesToShelter.toFixed(2) + ' min</span></div>' +
    '<div class="row"><span>Within limit</span><span class="' + (ok ? 'ok' : 'warn') + '">' +
      (ok ? 'yes' : 'NO - relaxed') + '</span></div>' +
    (note ? '<div class="note">' + note + '</div>' : '');
}

function showSoloDivert(w) {
  if (!w) { fail('no shelter reachable'); return; }
  if (w.points.length === 1) {
    L.marker(w.points[0], { icon: icon('refuge', '&#128737;', 34), interactive: false })
      .addTo(routeLayer).bindTooltip('Shelter here');
    $('stats').innerHTML = '<div class="row"><span>Mode</span><span>EMERGENCY</span></div>' +
      '<div class="note">Already at a shelter — take cover here.</div>';
    map.setView(w.points[0], 18);
    return;
  }
  $('stats').innerHTML = '<div class="row"><span>Mode</span><span>EMERGENCY</span></div>' +
    '<div class="note">Diverted mid-route to the nearest shelter.</div>';
  map.fitBounds(L.latLngBounds(w.points).pad(0.3), { maxZoom: 18 });
}

function renderCrowdStats() {
  const total     = walkers.length;
  const running   = walkers.filter(w => w.state === 'walking').length;
  const sheltered = walkers.filter(w => w.state === 'sheltered').length;
  const outside   = walkers.filter(w => w.state === 'outside').length;

  const ranked = Object.entries(doors)
    .map(entry => [entry[0], entry[1].admitted + entry[1].turnedAway, entry[1].turnedAway])
    .sort((a, b) => b[1] - a[1]);

  const worst = ranked.length ? ranked[0][1] : 0;

  let html =
    '<div class="row"><span>Alerted</span><span>' + total + ' people</span></div>' +
    '<div class="row"><span>Still running</span><span>' + running + '</span></div>' +
    '<div class="split">' +
      '<div class="card"><div class="big ok">' + sheltered + '</div>' +
        '<div class="lbl">sheltered</div></div>' +
      '<div class="card"><div class="big ' + (outside ? 'warn' : 'muted') + '">' + outside + '</div>' +
        '<div class="lbl">left outside</div></div>' +
    '</div>';

  if (ranked.length) {
    html += '<div class="row" style="margin-top:10px"><span>Doors used</span><span>' +
              ranked.length + '</span></div>' +
            '<div class="row"><span>Busiest door</span><span class="warn">' + worst +
              ' for ' + capacity() + ' places</span></div><div style="margin-top:6px">';

    ranked.slice(0, 8).forEach(entry => {
      const arrived = entry[1], turned = entry[2], got = arrived - turned;
      const scale = 150 / Math.max(1, worst);
      html += '<div class="barrow"><div class="n">' + got + '+' + turned + '</div>' +
              '<div style="display:flex">' +
                '<div class="bar" style="width:' + Math.round(got * scale) +
                  'px;background:var(--safe);border-radius:3px 0 0 3px"></div>' +
                '<div class="bar" style="width:' + Math.round(turned * scale) +
                  'px;background:var(--alert);border-radius:0 3px 3px 0"></div>' +
              '</div></div>';
    });
    html += '</div>';
  }

  if (outside) {
    html += '<div class="note">Every request is answered on its own, so neighbours are ' +
            'all sent to the same door — and ' + outside + ' of them find it full.</div>';
  }

  $('stats').innerHTML = html;
}

// ---------------------------------------------------------------------------
// Alert polling — one poll for the page, however many walkers there are
// ---------------------------------------------------------------------------

function paintAlertUi(areaId) {
  $('banner').textContent = alertActive ? 'ALERT — ' + areaId : 'NO ALERT';
  $('banner').className   = alertActive ? 'live' : 'quiet';
  $('alertToggle').textContent = alertActive ? 'Clear alert' : 'Simulate alert';
  $('alertToggle').className   = alertActive ? 'clear' : 'raise';
}

async function pollAlert() {
  try {
    const status = await (await fetch('/api/alerts/status')).json();
    if (status.alertActive === alertActive) { return; }
    alertActive = status.alertActive;
    paintAlertUi(status.areaId);
    if (walkers.length) { alertActive ? divertEveryone() : resumeEveryone(); }
  } catch (e) {
    // Server unreachable: hold the last banner rather than claim all-clear.
  }
}

$('go').onclick     = startWalk;
$('random').onclick = randomWalker;
$('crowd').onclick  = spawnCrowd;
$('reset').onclick  = () => {
  clearEveryone(); pinLayer.clearLayers();
  from = null; to = null;
  $('pickFrom').textContent = '—'; $('pickTo').textContent = '—';
  $('hint').innerHTML = 'Click the map to set your <b>start</b>, or send a crowd out walking.';
  $('go').disabled = true;
};
$('alertToggle').onclick = () =>
  fetch('/api/alerts/simulate?active=' + (!alertActive), { method: 'POST' });

setInterval(pollAlert, 1000);
pollAlert();
</script>
