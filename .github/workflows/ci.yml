on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        working-directory: fireRoute
        run: mvn --batch-mode clean verify